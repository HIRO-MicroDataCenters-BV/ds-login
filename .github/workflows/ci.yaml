name: Test and build server

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
    paths-ignore:
      - 'releases/**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: hiro-microdatacenters-bv/ds-login

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libsodium (keri runtime dep)
        run: sudo apt-get update && sudo apt-get install -y libsodium23

      - name: Install poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-root --with dev

      - name: Lint (ruff)
        run: poetry run ruff check app tests
        continue-on-error: true

      - name: Type check (mypy)
        run: poetry run mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        env:
          DS__ENVIRONMENT: local
          DS__LOG_LEVEL: WARNING
        run: poetry run pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute a versioned+SHA tag that matches every other ds-* service
      # (e.g. ds-contract-generator:0.1.0-dev.11.develop.0cce022a). Stable
      # + immutable, so ds-gitops overlays can pin to it with
      # pullPolicy: IfNotPresent and never hit ghcr's anonymous rate-limit
      # on pod restart.
      - name: Compute versioned tag
        id: version
        run: |
          APP_VERSION=$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' \
            server/charts/server/Chart.yaml)
          SHORT_SHA=${GITHUB_SHA:0:8}
          VERSIONED="${APP_VERSION}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_REF_NAME}.${SHORT_SHA}"
          echo "versioned=${VERSIONED}" >> "$GITHUB_OUTPUT"
          echo "Built tag: ${VERSIONED}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=long
            type=raw,value=${{ steps.version.outputs.versioned }}

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
