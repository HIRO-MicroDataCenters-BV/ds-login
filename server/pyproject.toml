[tool.poetry]
name = "ds-login"
version = "0.1.0"
description = "Login + credential verification service for Hiro dataspace — accepts a BYOK AID + ACDC credential, verifies against DKMS witnesses/watcher, issues a short-lived JWT."
authors = ["Hiro MicroDataCenters <dataspaces@hiro-microdatacenters.nl>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic = "^2.9"
pydantic-settings = "^2.5"
httpx = "^0.27"
pyjwt = { extras = ["crypto"], version = "^2.9" }
cryptography = "^43.0"
# keri is pinned to the version proven in Phase 0 — upgrade carefully, verify
# signatures still parse before bumping
keri = "1.3.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7"
pytest-asyncio = "^0.21"
pytest-cov = "^4"
respx = "^0.20"
ruff = "^0.1"
mypy = "^1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
