image:
  repository: ghcr.io/hiro-microdatacenters-bv/ds-login
  pullPolicy: IfNotPresent
  tag: ""     # defaults to Chart.appVersion when empty

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ds-login.local
  tls:
    enabled: false
    secretName: ""

# Backend URLs — WHERE DOES DKMS LIVE?
# These default to the keriox stack running inside the same cluster.
# Override per partner node via the Fleet GitOps values overlay.
dkms:
  watcherUrl: "http://keriox-watcher:3235"
  witnessUrls:
    - "http://keriox-witness1:3232"
    - "http://keriox-witness2:3233"
    - "http://keriox-witness3:3234"

jwt:
  issuer: "ds-login"
  audience: "hiro-services"
  ttlSeconds: 900
  # RSA signing key for JWT issuance.
  #
  #   signingKeySecretName: "my-secret"   → the chart mounts that Secret at
  #     /etc/ds-login/signing-key/ and ds-login reads the key from
  #     signingKeySecretField. JWTs survive pod restarts.
  #
  #   signingKeySecretName: ""            → the chart renders no volume and
  #     no DS__JWT_PRIVATE_KEY_PEM_PATH env var. ds-login generates a
  #     transient RSA key in memory at startup. Each pod restart invalidates
  #     every active JWT. Fine for demos; NOT for production.
  signingKeySecretName: ""
  signingKeySecretField: "private.pem"

environment: "production"   # local / dev / staging / production
logLevel: "INFO"

# AIDs this verifier will accept IPEX grants FROM. The chart emits this
# as DS__TRUSTED_ISSUER_AIDS (JSON). Empty = reject-all (fail-safe); the
# server refuses to start in environment=production when empty. Set to
# the trusted ds-credential-issuer AID per deployment (visible in the
# issuer's startup log: 'issuer identifier ready: alias=... aid=...').
# Rahul audit #1.
trustedIssuerAids: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
serviceAccount:
  create: true
  name: ""
